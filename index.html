<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f7f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Flex Paint</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
  <main class="app-shell">
    <header class="titlebar">
      <div class="brand" aria-label="Flex Paint">
        <span class="brand-mark" aria-hidden="true">🎨</span>
        <span>Flex Paint</span>
      </div>
      <div class="app-modes" role="group" aria-label="App mode">
        <button class="app-mode active" data-app-mode="paint" aria-pressed="true">🎨 Paint</button>
        <button class="app-mode" data-app-mode="learn" aria-pressed="false">📚 Learn</button>
      </div>
      <div class="title-actions">
        <button class="fullscreen-button" id="fullscreenBtn" aria-label="Enter full screen" title="Full screen">
          <span aria-hidden="true">⛶</span><span class="fullscreen-label">Full screen</span>
        </button>
        <button class="lock-button" id="lockBtn" aria-pressed="false" aria-label="Turn on Little hands mode">
          <span aria-hidden="true">🔓</span><span class="lock-label">Little hands</span>
        </button>
        <nav class="quick-actions" aria-label="History">
          <button class="icon-button" id="undoBtn" title="Undo" aria-label="Undo" disabled>↶</button>
          <button class="icon-button" id="redoBtn" title="Redo" aria-label="Redo" disabled>↷</button>
          <button class="clear-button" id="clearBtn" title="Clear the canvas">New picture</button>
        </nav>
      </div>
    </header>

    <section class="ribbon paint-ribbon" aria-label="Drawing controls">
      <div class="tool-group tools" aria-label="Tools">
        <button class="tool active" data-tool="brush" aria-pressed="true"><span>🖌️</span><small>Brush</small></button>
        <button class="tool" data-tool="pencil" aria-pressed="false"><span>✏️</span><small>Pencil</small></button>
        <button class="tool" data-tool="eraser" aria-pressed="false"><span>◫</span><small>Eraser</small></button>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="tool-group stamp-group" role="group" aria-label="Drum stamps">
        <span class="group-label">Stamps</span>
        <button class="stamp" data-stamp="toy-kit" aria-pressed="false" aria-label="Place a colorful toy drum kit"><svg viewBox="0 0 64 48" aria-hidden="true"><path d="M7 39h50l-5 5H12z" fill="#55b9d5" stroke="#308ba7" stroke-width="2"/><path d="M15 36 12 44M32 36v8M49 36l3 8" stroke="#69b943" stroke-width="4" stroke-linecap="round"/><g stroke="#a9562d" stroke-width="2"><path d="M8 16Q8 13 12 13h10q4 0 4 3v15q-9 7-18 0z" fill="#82c950"/><ellipse cx="17" cy="16" rx="9" ry="3" fill="#ffbe63"/><ellipse cx="17" cy="16" rx="6.5" ry="1.8" fill="#55bee5"/><path d="M25 8q0-3 4-3h9q4 0 4 3v21q-8 6-17 0z" fill="#80c850"/><ellipse cx="33.5" cy="8" rx="8.5" ry="3" fill="#ffbe63"/><ellipse cx="33.5" cy="8" rx="6" ry="1.8" fill="#9bc64b"/><path d="M39 16q0-3 4-3h9q4 0 4 3v15q-9 7-17 0z" fill="#82c950"/><ellipse cx="47.5" cy="16" rx="8.5" ry="3" fill="#ffbe63"/><ellipse cx="47.5" cy="16" rx="6" ry="1.8" fill="#ec7044"/></g></svg><small>Kit</small></button>
        <button class="stamp" data-stamp="snare" aria-pressed="false" aria-label="Place a snare drum"><svg viewBox="0 0 64 48" aria-hidden="true"><path d="M13 14Q13 11 18 11h28q5 0 5 3v19q-19 10-38 0z" fill="#ed9843" stroke="#a9562d" stroke-width="2.5"/><ellipse cx="32" cy="14" rx="19" ry="6" fill="#ffbe63" stroke="#a9562d" stroke-width="2.5"/><ellipse cx="32" cy="14" rx="15" ry="4" fill="#e7edf2" stroke="#b8c4d0" stroke-width="2"/><path d="M20 35v6m24-6v6M17 38h30" stroke="#7e583c" stroke-width="2.5" stroke-linecap="round"/><path d="M20 32h24m-22 3h20" stroke="#b8c4d0" stroke-width="1.5"/></svg><small>Snare</small></button>
        <button class="stamp" data-stamp="bongos" aria-pressed="false" aria-label="Place a pair of bongo drums"><svg viewBox="0 0 64 48" aria-hidden="true"><g stroke="#9b5d32" stroke-width="2.5"><path d="M5 17q0-3 4-3h17q4 0 4 3v17q-12 7-25 0z" fill="#c77a39"/><ellipse cx="17.5" cy="17" rx="12.5" ry="5" fill="#f4d49a"/><path d="M34 13q0-3 4-3h17q4 0 4 3v21q-12 7-25 0z" fill="#d18b43"/><ellipse cx="46.5" cy="13" rx="12.5" ry="5" fill="#ffe2a8"/></g><path d="m11 37-3 5m40-5 5 5" stroke="#87502d" stroke-width="2.5" stroke-linecap="round"/></svg><small>Bongos</small></button>
        <button class="stamp" data-stamp="bass" aria-pressed="false" aria-label="Place a bass drum"><svg viewBox="0 0 64 48" aria-hidden="true"><ellipse cx="32" cy="24" rx="21" ry="20" fill="#f39a3d" stroke="#964d2a" stroke-width="3"/><ellipse cx="32" cy="24" rx="16" ry="15" fill="#fff0d5" stroke="#d07837" stroke-width="2"/><circle cx="32" cy="24" r="4" fill="#46536b" stroke="#26364b" stroke-width="2"/><g fill="#ffe29d" stroke="#a85c2c"><circle cx="32" cy="5" r="1.8"/><circle cx="45" cy="10" r="1.8"/><circle cx="51" cy="24" r="1.8"/><circle cx="45" cy="38" r="1.8"/><circle cx="32" cy="43" r="1.8"/><circle cx="19" cy="38" r="1.8"/><circle cx="13" cy="24" r="1.8"/><circle cx="19" cy="10" r="1.8"/></g></svg><small>Bass</small></button>
        <button class="stamp" data-stamp="tom" aria-pressed="false" aria-label="Place a colorful tom drum"><svg viewBox="0 0 64 48" aria-hidden="true"><path d="M12 14q0-4 5-4h30q5 0 5 4v20q-20 9-40 0z" fill="#66b64e" stroke="#a9562d" stroke-width="2.5"/><ellipse cx="32" cy="14" rx="20" ry="6" fill="#ffbe63" stroke="#a9562d" stroke-width="2.5"/><ellipse cx="32" cy="14" rx="15.5" ry="4" fill="#60bee3" stroke="#ce793c" stroke-width="2"/><path d="m21 36-4 7m26-7 4 7" stroke="#7e583c" stroke-width="2.5" stroke-linecap="round"/></svg><small>Tom</small></button>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="tool-group size-group">
        <label for="sizeRange">Size <output id="sizeOutput">18</output></label>
        <input id="sizeRange" type="range" min="2" max="72" value="18" />
        <div class="size-preview"><span id="sizePreview"></span></div>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="tool-group paint-group">
        <div class="mode-tabs" role="group" aria-label="Color mode">
          <button class="mode active" data-mode="solid" aria-pressed="true">Solid</button>
          <button class="mode" data-mode="gradient" aria-pressed="false">Gradient</button>
          <button class="mode rainbow-mode" data-mode="rainbow" aria-pressed="false">Rainbow</button>
        </div>
        <button class="color-summary" id="colorPanelBtn" aria-expanded="false" aria-controls="colorPanel">
          <span class="color-swatch" id="activeSwatch"></span>
          <span id="colorSummaryText">Choose color</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="tool-group symmetry-group">
        <span class="group-label">Symmetry</span>
        <div class="segmented symmetry-options" role="group" aria-label="Symmetry mode">
          <button class="sym active" data-symmetry="none" aria-pressed="true">Off</button>
          <button class="sym" data-symmetry="vertical" aria-pressed="false">↔</button>
          <button class="sym" data-symmetry="horizontal" aria-pressed="false">↕</button>
          <button class="sym" data-symmetry="quad" aria-pressed="false">✣</button>
          <button class="sym" data-symmetry="eight" aria-pressed="false">✺</button>
        </div>
      </div>
    </section>

    <section class="ribbon learn-ribbon" aria-label="Learning controls" hidden>
      <div class="learn-controls">
        <label for="traceItem">Choose a letter or number worksheet</label>
        <select id="traceItem" aria-label="Choose a U.S. letter or number"></select>
        <button class="learn-nav" id="previousItem" aria-label="Previous letter or number">←</button>
        <button class="learn-nav" id="nextItem" aria-label="Next letter or number">→</button>
        <button class="clear-button" id="clearTrace">Try again</button>
        <span class="learn-tip">Follow the dotted lines with your finger or a stylus.</span>
      </div>
    </section>

    <section class="color-panel" id="colorPanel" hidden>
      <div class="panel-section solid-picker-section">
        <span class="panel-label">Drag to pick a color</span>
        <div class="spectrum-picker">
          <div class="spectrum-field" id="spectrumField" role="slider" tabindex="0" aria-label="Rainbow color field" aria-valuetext="Blue">
            <span class="spectrum-thumb" id="spectrumThumb"></span>
          </div>
          <div class="brightness-track" id="brightnessTrack" role="slider" tabindex="0" aria-label="Color brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="88">
            <span class="brightness-thumb" id="brightnessThumb"></span>
          </div>
        </div>
        <span class="panel-label quick-label">Quick colors</span>
        <input type="color" id="solidColor" value="#3478f6" aria-label="Choose a color" />
        <div class="basic-colors" id="basicColors" aria-label="Quick colors"></div>
      </div>

      <div class="panel-section gradient-section">
        <span class="panel-label">My colors <small>tap to edit</small></span>
        <div class="stop-editor" id="stopEditor"></div>
        <button class="mini-button" id="addStopBtn">＋ Color</button>
        <button class="mini-button" id="reverseBtn">⇄ Reverse</button>
      </div>

      <div class="panel-section gradient-section">
        <span class="panel-label">Style</span>
        <div class="segmented compact" role="group" aria-label="Gradient style">
          <button class="style active" data-style="smooth" aria-pressed="true">Smooth</button>
          <button class="style" data-style="bands" aria-pressed="false">Bands</button>
        </div>
        <label class="repeat-control">Repeat
          <input id="repeatRange" type="range" min="40" max="500" value="180" />
        </label>
      </div>

      <div class="panel-section presets-section">
        <span class="panel-label">Happy palettes</span>
        <div class="presets" id="presets"></div>
        <button class="mini-button" id="savePresetBtn">♡ Save mine</button>
      </div>
    </section>

    <section class="canvas-stage" id="canvasStage">
      <div class="lock-badge" id="lockBadge" aria-hidden="true">🔒 Little hands mode</div>
      <div class="canvas-frame" id="canvasFrame">
        <canvas id="guideCanvas" width="1280" height="720" aria-hidden="true"></canvas>
        <canvas id="paintCanvas" width="1280" height="720" aria-label="Drawing canvas"></canvas>
        <div class="brush-cursor" id="brushCursor" aria-hidden="true"><span></span></div>
        <div class="empty-hint" id="emptyHint">
          <span>Draw something wonderful!</span>
          <small>Use a finger, pencil, or mouse</small>
        </div>
      </div>
    </section>

    <footer class="statusbar">
      <span id="statusText">Brush · Solid</span>
      <span>16:9 canvas</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=11"></script>
</body>
</html>
